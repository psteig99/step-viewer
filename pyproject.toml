[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepviewer"
version = "1.0.0"
description = "STEP CAD file viewer and analyser for packaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cascadio>=0.0.14",
    "trimesh>=4.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
viewer = ["pyvista>=0.44"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
ai  = ["anthropic>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
stepviewer = "stepviewer.cli:main"

[tool.setuptools.packages.find]
include = ["stepviewer*"]
